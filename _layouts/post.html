---
layout: default
---
{%- comment -%} Port of the Django site's content/post_detail.html {%- endcomment -%}
<style>

  a {
    color:var(--scheme-red);
  }
  a:hover {
    color:var(--scheme-red);
  }


  .head_text {
      color:var(--text-white);
      /* text-shadow: rgba(137, 22, 14, 0.658) -2px 2px 10px; */


  }
  @media all and (max-width: 640px) {
    .head_text {
      flex-flow:column wrap;
      text-align: center;
    }
  }
  #post-card {
      background-color: var(--scheme-post-bg);

      border-left: var(--scheme-red) solid 5px!important;
      border-radius: 5px;
      font-size: 25px;
      font-family: Aldrich;
      padding: 15px;
      color: var(--text-grey);
  }
  #post-content {
    background-color: var(--scheme-post-content-bg) !important;
    border-radius: 5px;
    padding: 5px 10px;
  }



</style>
<header style="padding-top: 75px;"></header>
<div class="container">
  <div class="row">
    <div class="col">
    <div class="card" style="background-color: transparent;border-radius: 5px;">
      <!-- <a href="" style="text-decoration: none;"> -->
          <div class="card-body" id="post-card">
            <div class="d-flex head_text">
              <div class="p-2 flex-grow-1"><b>{{ page.title | escape }}</b></div>
              <div class="p-2" style="color: var(--text-grey);">{{ page.author | escape }}</div>
              <div class="p-2" style="color: var(--text-grey);">{% include ap-date.html date=page.date %}</div>
            </div>
            <div id="post-content">
              <p class="card-text">{{ content }}</p>
            </div>
          </div>
      <!-- </a>       -->
    </div>
    </div>




  </div>
</div>
